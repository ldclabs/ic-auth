[workspace]
members = [
  "rs/ic_auth_types",
  "rs/ic_auth_verifier",
  "rs/ic_auth_verify_server",
]
resolver = "2"

[workspace.package]
version = "0.10.4"
edition = "2024"
repository = "https://github.com/ldclabs/ic-auth"
keywords = ["auth", "identity", "deeplink", "icp", "canister"]
description = "🔏 The Internet Computer identity based web authentication."
categories = ["web-programming"]
license = "MIT"

[workspace.dependencies]
arc-swap = "1.9"
base64 = "0.23"
candid = "0.10"
cbor2 = "1"
hex = "0.4"
http = "1.5"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
serde_cbor = "0.11"
k256 = { version = "0.14" }
p256 = { version = "0.14" }
ed25519-dalek = "3"
rand = "0.10"
sha2 = "0.11"
sha3 = "0.12"
ic-certification = "3.2"
ic-verify-bls-signature = "0.6"
ic-canister-sig-creation = "1.3"
ic-representation-independent-hash = "3.2"
ic-agent = "0.49"
simple_asn1 = "0.6"
xid = "1.1"
url = "2.5"

[profile.release]
# `strip` removes the symbol table, which dominates the binary size, and
# fat LTO plus a single codegen unit trims the rest. `panic` is deliberately
# left at "unwind": with "abort" a panic in one request handler would take the
# whole server down instead of just that connection.
lto = true
codegen-units = 1
strip = true
