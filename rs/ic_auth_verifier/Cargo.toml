[package]
name = "ic_auth_verifier"
description = "Signature, delegation, HTTP envelope, and deep-link verification utilities for IC-Auth."
publish = true
repository = "https://github.com/ldclabs/ic-auth/tree/main/rs/ic_auth_verifier"
version.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[dependencies]
ic_auth_types = { path = "../ic_auth_types", version = "0.10", optional = true }
candid = { workspace = true, optional = true }
serde = { workspace = true }
serde_bytes = { workspace = true, optional = true }
serde_cbor = { workspace = true, optional = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
k256 = { workspace = true }
p256 = { workspace = true }
ed25519-dalek = { workspace = true }
simple_asn1 = { workspace = true }
ic-canister-sig-creation = { workspace = true }
ic-representation-independent-hash = { workspace = true, optional = true }
ic-certification = { workspace = true, optional = true }
ic-verify-bls-signature = { workspace = true, optional = true }
arc-swap = { workspace = true, optional = true }
http = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
ic-agent = { workspace = true, optional = true }
url = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native verification retains fast tables; canisters need no OS randomness.
k256 = { workspace = true, features = ["std", "precomputed-tables"] }
p256 = { workspace = true, features = ["std", "precomputed-tables"] }

[dev-dependencies]
cbor2 = { workspace = true }
hex = { workspace = true }
ic-agent = { workspace = true }
rand = { workspace = true }

[features]
default = []
full = ["identity"]
envelope = [
  "dep:ic_auth_types", "dep:candid", "dep:hex",
  "dep:http", "dep:base64", "dep:url", "dep:serde_bytes", "dep:serde_cbor",
  "dep:ic-representation-independent-hash", "dep:ic-certification",
  "dep:ic-verify-bls-signature",
]
# should not include `identity` feature for canister
identity = ["envelope", "dep:ic-agent", "dep:arc-swap", "dep:rand"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
