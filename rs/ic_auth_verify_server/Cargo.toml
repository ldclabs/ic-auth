[package]
name = "ic_auth_verify_server"
description = "HTTP JSON/CBOR service for verifying IC-Auth signed envelopes."
repository = "https://github.com/ldclabs/ic-auth/tree/main/rs/ic_auth_verify_server"
publish = false
version.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[dependencies]
ic_auth_types = { path = "../ic_auth_types", version = "0.10" }
# Only `envelope` is needed to verify: `full` would add `identity`, pulling in
# ic-agent -> reqwest -> rustls -> aws-lc-sys. This server never opens an
# outbound connection, so that is an unused HTTP+TLS stack (and a C dependency)
# linked into the binary. The tests do need it, so they enable it below.
ic_auth_verifier = { path = "../ic_auth_verifier", version = "0.10", features = [
  "envelope",
] }
axum-core = "0.5"
axum = { version = "0.8", features = [
  "http1",
  "http2",
  "json",
  # "macros",
  "matched-path",
  "tokio",
  "query",
], default-features = true }
bytes = "1.11"
candid = { workspace = true }
cbor2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
http = { workspace = true }
mime = "0.3"
tokio = { version = "1", features = ["full"] }
structured-logger = "1"
log = { version = "0.4", features = ["kv_serde"] }

[dev-dependencies]
ic_auth_verifier = { path = "../ic_auth_verifier", version = "0.10", features = [
  "full",
] }
