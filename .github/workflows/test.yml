name: Test
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dfinity/setup-dfx@main
      - name: Run tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          cargo test --locked -p ic_auth_types --no-default-features
          cargo test --locked -p ic_auth_verifier --no-default-features
          cargo test --locked -p ic_auth_verifier --features envelope
      - name: Check canister configurations
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --locked -p ic_auth_types --target wasm32-unknown-unknown
          cargo check --locked -p ic_auth_verifier --target wasm32-unknown-unknown
          cargo check --locked -p ic_auth_verifier --features envelope --target wasm32-unknown-unknown

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts/ic-auth
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ts/ic-auth-worker/package.json
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check SDK
        run: |
          pnpm format:check
          pnpm typecheck
          pnpm build
          pnpm test
      - name: Check minimum supported cborg
        run: |
          pnpm add --save-dev --save-exact cborg@4.5.0
          pnpm typecheck
          pnpm build
          pnpm test

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts/ic-auth-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ts/ic-auth-worker/package.json
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Worker
        run: |
          pnpm format:check
          pnpm typecheck
          pnpm test
          pnpm build
