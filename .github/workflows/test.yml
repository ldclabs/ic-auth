name: Test
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dfinity/setup-dfx@main
      - name: Run tests
        run: |
          cargo clippy --verbose --all-targets --all-features
          cargo test --verbose --workspace --all-features -- --nocapture

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts/ic-auth-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ts/ic-auth-worker/package.json
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Worker
        run: |
          pnpm format:check
          pnpm typecheck
          pnpm test
          pnpm build
